[project]
name = "mito"
version = "1.1.1"
description = "The Mention Typing Ontology (MiTO) is an ontology written in OWL 2 DL. Its aim is to enable the formalization of the concept of mentions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "codespell>=2.4.3",
    "owlrl>=7.6.2",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
]
