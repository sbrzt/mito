name: Docs and release

on:
  push:
    branches: [ main ]
    paths: [ docs/current/mito.ttl ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    uses: ./.github/workflows/lode.yml
    with:
      ontology: docs/current/mito.ttl

  snapshot:
    needs: docs
    runs-on: ubuntu-latest
    steps:
      # main, not the triggering commit, so the copy includes the docs commit from the previous job
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install rdflib
        run: pip install rdflib

      - name: Copy docs/current to docs/<dcterms:modified>
        run: |
          date=$(python - docs/current/mito.ttl <<'EOF'
          import sys
          from rdflib import Graph, OWL, RDF, DCTERMS
          g = Graph().parse(sys.argv[1])
          print(g.value(g.value(None, RDF.type, OWL.Ontology), DCTERMS.modified) or "")
          EOF
          )
          [[ $date =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad or missing dcterms:modified: '$date'"; exit 1; }
          rm -rf "docs/$date"
          cp -r docs/current "docs/$date"
          echo "Snapshot -> docs/$date"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "DOCS: add versioned documentation snapshot"
          git push
